<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Punto Tricolor × El Paraíso</title>
<style>
body{margin:0;background:#070B18;color:#fff;font-family:system-ui,sans-serif;padding-bottom:40px}
header{position:sticky;top:0;padding:12px;background:#070B18;border-bottom:1px solid #6366F1;z-index:2}
h1{font-size:12px;letter-spacing:.14em;color:#22D3EE;margin:0 0 10px}
.bar{display:flex;gap:8px}
a.btn{flex:1;text-align:center;text-decoration:none;font-weight:800;padding:14px;border-radius:14px;color:#fff;background:#6366F1}
a.btn2{background:transparent;border:1px solid #22D3EE;color:#22D3EE}
.hint{color:#94a3b8;padding:10px 12px;font-size:13px;line-height:1.4}
img{width:100%;display:block;border-radius:12px}
section{padding:8px}
.n{font-size:11px;color:#94a3b8;padding:6px 4px 10px}
</style>
</head>
<body>
<header>
<h1>PUNTO TRICOLOR × EL PARAÍSO</h1>
<div class="bar">
<a class="btn" href="https://cdn.jsdelivr.net/gh/andres2017/pitch-hotel-paraiso@main/Punto-Tricolor-Ecosistema-Hotel-Paraiso.pdf">Abrir PDF</a>
<a class="btn btn2" href="https://cdn.jsdelivr.net/gh/andres2017/pitch-hotel-paraiso@main/Punto-Tricolor-Ecosistema-Hotel-Paraiso.pptx">PowerPoint</a>
</div>
</header>
<p class="hint">Toca <b>Abrir PDF</b>. Si no baja, mantén pulsada cada lámina → Guardar imagen.</p>
<script>
const CDN="https://cdn.jsdelivr.net/gh/andres2017/pitch-hotel-paraiso@main/";
const t=["El ecosistema del hotel","Tres pilares","Antes · durante · después","12 módulos","Reservas","Flujo de reserva","QR habitación","Cocina","CRM","Recompra","Eventos","Un sábado","La cuenta","Planes","Cierre"];
for(let i=1;i<=15;i++){
  const n=String(i).padStart(2,"0");
  document.write('<section><img src="'+CDN+'pagina-'+n+'.jpg" alt="Lámina '+i+'"/><p class="n">'+n+' / 15 · '+t[i-1]+'</p></section>');
}
</script>
</body>
</html>
